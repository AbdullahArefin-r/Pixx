name: Build Plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q PickaxeDrill-source.zip -d extracted

          echo "=== Extracted structure ==="
          find extracted -maxdepth 4 -type f | sort

      - name: Find Gradle Project
        id: project
        run: |
          PROJECT_DIR=$(find extracted -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found!"
            exit 1
          fi

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Building from:"
          pwd

          echo "=== Project files ==="
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew shadowJar --no-daemon
          else
            gradle shadowJar --no-daemon
          fi

      - name: Find JAR
        id: jar
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "=== Generated JARs ==="

          find build/libs -type f -name "*.jar" -print

          JAR=$(find build/libs -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR found!"
            exit 1
          fi

          echo "Selected JAR:"
          echo "$JAR"

          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.jar.outputs.jar }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Build ${{ github.run_number }}"
          generate_release_notes: true
          files: ${{ steps.project.outputs.project_dir }}/${{ steps.jar.outputs.jar }}
          make_latest: true
