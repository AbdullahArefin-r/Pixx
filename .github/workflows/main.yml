name: Build PickaxeDrill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract ZIP
        run: |
          set -eux

          echo "WORKSPACE=$GITHUB_WORKSPACE"

          rm -rf "$GITHUB_WORKSPACE/PickaxeDrill"

          unzip -o "$GITHUB_WORKSPACE/PickaxeDrill-source.zip" \
            -d "$GITHUB_WORKSPACE"

          echo "=== Project ==="
          ls -la "$GITHUB_WORKSPACE/PickaxeDrill"

          test -f "$GITHUB_WORKSPACE/PickaxeDrill/build.gradle.kts"
          test -f "$GITHUB_WORKSPACE/PickaxeDrill/settings.gradle.kts"

      - name: Build PickaxeDrill
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/PickaxeDrill"

          echo "================================"
          echo "CURRENT DIRECTORY"
          echo "================================"
          pwd

          echo "================================"
          echo "GRADLE FILES"
          echo "================================"
          ls -la build.gradle.kts settings.gradle.kts

          echo "================================"
          echo "BUILD"
          echo "================================"

          gradle shadowJar --no-daemon

      - name: Find JAR
        id: jar
        run: |
          set -eux

          JAR=$(find "$GITHUB_WORKSPACE/PickaxeDrill/build/libs" \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "No JAR found!"
            find "$GITHUB_WORKSPACE/PickaxeDrill/build" -type f
            exit 1
          fi

          echo "JAR=$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PickaxeDrill
          path: ${{ steps.jar.outputs.jar }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "PickaxeDrill Build ${{ github.run_number }}"
          generate_release_notes: true
          make_latest: true
          files: ${{ steps.jar.outputs.jar }}
