name: Build PickaxeDrill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract ZIP
        run: |
          set -e

          echo "Workspace:"
          pwd

          echo "Extracting ZIP directly into workspace..."

          unzip -o PickaxeDrill-source.zip

          echo ""
          echo "Checking project:"
          ls -la PickaxeDrill

          echo ""
          echo "Gradle files:"
          test -f PickaxeDrill/settings.gradle.kts
          test -f PickaxeDrill/build.gradle.kts

          echo "Gradle project FOUND!"

      - name: Build PickaxeDrill
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/PickaxeDrill"

          echo "================================="
          echo "BUILD DIRECTORY"
          echo "================================="
          pwd

          echo ""
          echo "Contents:"
          ls -la

          echo ""
          echo "Running Gradle..."

          gradle --version

          gradle shadowJar --no-daemon

      - name: Find JAR
        id: jar
        run: |
          set -e

          echo "=== BUILD/LIBS ==="

          ls -lah "$GITHUB_WORKSPACE/PickaxeDrill/build/libs"

          JAR=$(find "$GITHUB_WORKSPACE/PickaxeDrill/build/libs" \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: JAR was not generated!"
            exit 1
          fi

          echo "JAR FOUND:"
          echo "$JAR"

          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PickaxeDrill
          path: ${{ steps.jar.outputs.jar }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "PickaxeDrill Build ${{ github.run_number }}"
          generate_release_notes: true
          make_latest: true
          files: ${{ steps.jar.outputs.jar }}
