name: Build PickaxeDrillvvv

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 3. Extract ZIP
      - name: Extract source ZIP
        run: |
          mkdir -p extracted
          unzip -q PickaxeDrill-source.zip -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort

      # 4. Build project
      - name: Build PickaxeDrill
        working-directory: extracted/PickaxeDrill
        run: |
          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew clean build --no-daemon
          else
            gradle clean build --no-daemon
          fi

      # 5. Find generated JAR
      - name: Find JAR
        id: jar
        working-directory: extracted/PickaxeDrill
        run: |
          JAR=$(find build/libs -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR found!"
            find build -type f | sort
            exit 1
          fi

          echo "Found JAR: $JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      # 6. Create GitHub Release and upload JAR
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "PickaxeDrill Build ${{ github.run_number }}"
          body: |
            ## PickaxeDrill

            Automated build from commit:

            `${{ github.sha }}`

            Build #${{ github.run_number }}
          files: extracted/PickaxeDrill/${{ steps.jar.outputs.jar }}
          make_latest: true
